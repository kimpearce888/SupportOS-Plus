[workspace]
resolver = "3"
members = [
    "crates/app-shell",
    "crates/catalog",
    "crates/core",
    "crates/xtask",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
# MSRV = the pinned toolchain (rust-toolchain.toml, D1/D5: stability
# first). Older compilers are never tested, so claiming 1.85 would be
# dishonest.
rust-version = "1.99"
license = "MIT"
authors = ["kimpearce888"]
repository = "https://github.com/kimpearce888/SupportOS-PlusPlus"
homepage = "https://github.com/kimpearce888/SupportOS-PlusPlus"

[workspace.dependencies]
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }

tokio = { version = "1", features = ["full"] }

rusqlite = { version = "0.40", features = ["bundled", "blob", "limits"] }

aes-gcm = "0.11"
scrypt = "0.12"
rand = "0.10"
subtle = "2.6"

# --- egui stack (decision D1): exact pins, first consumed by crates/app-shell in Phase 2 ---
egui = { version = "=0.37" }
eframe = { version = "=0.37" }
egui_extras = { version = "=0.37" }
# NOTE: egui_plot 0.37 builds against egui 0.36 (no release targets 0.37
# yet — releases lag one minor). Re-pin and adopt it once it catches up;
# until then the shell renders its charts with the egui painter
# (crates/app-shell/src/chart.rs).


regex = "1"

reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "form"] }

futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }

url = "2"

supportos-plusplus-catalog = { path = "crates/catalog" }
supportos-plusplus-core = { path = "crates/core" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[profile.dev]
# No debuginfo: keeps memory/disk footprint low when compiling the embedded
# qdrant engine in constrained environments.
debug = 0
