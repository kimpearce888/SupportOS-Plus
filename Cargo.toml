[workspace]
resolver = "3"
members = [
    "crates/app-shell",
    "crates/catalog",
    "crates/core",
    "crates/xtask",
]

[workspace.package]
version = "1.10.1"
edition = "2024"
rust-version = "1.99"
license = "MIT"
authors = ["kimpearce888"]
repository = "https://github.com/kimpearce888/SupportOS-Plus"
homepage = "https://github.com/kimpearce888/SupportOS-Plus"

[workspace.dependencies]
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

chrono = { version = "0.4" }
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }

tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "fs"] }

rusqlite = { version = "0.41", features = ["bundled"] }

aes-gcm = "0.11"
rand = "0.10"

eframe = { version = "=0.37", features = ["glow"] }


regex = "1"

reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "form"] }

futures-util = "0.3"

url = "2"

supportos-plus-catalog = { path = "crates/catalog" }
supportos-plus-core = { path = "crates/core" }

[workspace.lints.clippy]
borrow_as_ptr = "warn"
cast_ptr_alignment = "warn"
comparison_chain = "warn"
expl_impl_clone_on_copy = "warn"
filter_map_next = "warn"
invalid_upcast_comparisons = "warn"
large_futures = "warn"
large_types_passed_by_value = "warn"
linkedlist = "warn"
maybe_infinite_iter = "warn"
missing_fields_in_debug = "warn"
mismatching_type_param_order = "warn"
option_option = "warn"
ptr_as_ptr = "warn"
ptr_offset_by_literal = "warn"
return_self_not_must_use = "warn"
string_add_assign = "warn"
transmute_ptr_to_ptr = "warn"
unnecessary_box_returns = "warn"
unsafe_derive_deserialize = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[profile.dev]
debug = 0
