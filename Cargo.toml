[workspace]
resolver = "3"
members = [
    "crates/catalog",
    "crates/core",
    "crates/ui",
    "crates/xtask",
    "crates/app/src-tauri",
    "crates/app/src-tauri",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["kimpearce888"]
repository = "https://github.com/kimpearce888/SupportOS-PlusPlus"
homepage = "https://github.com/kimpearce888/SupportOS-PlusPlus"

[workspace.dependencies]
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }

tokio = { version = "1", features = ["full"] }

rusqlite = { version = "0.40", features = ["bundled", "blob", "limits"] }

aes-gcm = "0.11"
scrypt = "0.12"
rand = "0.10"
subtle = "2.6"

# --- egui stack (decision D1): exact pins, first consumed by crates/app-shell in Phase 2 ---
egui = { version = "=0.37" }
eframe = { version = "=0.37" }
egui_extras = { version = "=0.37" }
egui_plot = { version = "=0.37" }

axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "tower-log", "macros", "json", "query"] }
tower-http = { version = "0.7", features = ["cors", "trace", "catch-panic"] }

regex = "1"

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }

url = "2"

supportos-plusplus-catalog = { path = "crates/catalog" }
supportos-plusplus-core = { path = "crates/core" }
supportos-plusplus-ui = { path = "crates/ui" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[profile.dev]
# No debuginfo: keeps memory/disk footprint low when compiling the embedded
# qdrant engine in constrained environments.
debug = 0
