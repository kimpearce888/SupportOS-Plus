[workspace]
resolver = "3"
members = [
    "crates/app-shell",
    "crates/catalog",
    "crates/core",
    "crates/xtask",
]

[workspace.package]
version = "1.9.8"
edition = "2024"
rust-version = "1.99"
license = "MIT"
authors = ["kimpearce888"]
repository = "https://github.com/kimpearce888/SupportOS-Plus"
homepage = "https://github.com/kimpearce888/SupportOS-Plus"

[workspace.dependencies]
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

chrono = { version = "0.4" }
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }

tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "fs"] }

rusqlite = { version = "0.41", features = ["bundled"] }

aes-gcm = "0.11"
rand = "0.10"

eframe = { version = "=0.37", features = ["glow"] }


regex = "1"

reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "form"] }

futures-util = "0.3"

url = "2"

supportos-plus-catalog = { path = "crates/catalog" }
supportos-plus-core = { path = "crates/core" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[profile.dev]
debug = 0
