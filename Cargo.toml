[workspace]
resolver = "3"
members = [
    "crates/app-shell",
    "crates/catalog",
    "crates/core",
    "crates/xtask",
]

[workspace.package]
version = "1.4.0"
edition = "2024"
# MSRV = the pinned toolchain (rust-toolchain.toml, D1/D5: stability
# first). Older compilers are never tested, so claiming 1.85 would be
# dishonest.
rust-version = "1.99"
license = "MIT"
authors = ["kimpearce888"]
repository = "https://github.com/kimpearce888/SupportOS-Plus"
homepage = "https://github.com/kimpearce888/SupportOS-Plus"

[workspace.dependencies]
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }

# Plan row 12 ("tokio full → slim"): the port uses exactly rt (spawn,
# spawn_blocking, runtime builders, handles), rt-multi-thread (the
# 2-thread background worker runtime), time (interval/sleep timers) and
# sync (broadcast event bus, oneshot channels). net/io come in through
# reqwest's own dependency via feature unification; fs/process/signal
# have zero call sites.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync"] }

rusqlite = { version = "0.40", features = ["bundled", "blob", "limits"] }

aes-gcm = "0.11"
scrypt = "0.12"
rand = "0.10"
subtle = "2.6"

# --- egui stack (decision D1): exact pins, first consumed by crates/app-shell in Phase 2 ---
egui = { version = "=0.37" }
# v1.1.1: `glow` is compiled into every build and is the default
# renderer (see app-shell `resolve_renderer`). eframe's own default
# (wgpu alone) needs a Vulkan driver or a GLES stack — neither is
# guaranteed on real machines, which is exactly how 1.1.0 failed to
# start outside CI. wgpu stays compiled in via eframe defaults; it is
# reachable again with SPP_RENDERER=wgpu.
eframe = { version = "=0.37", features = ["glow"] }
egui_extras = { version = "=0.37" }
# NOTE: egui_plot 0.37 builds against egui 0.36 (no release targets 0.37
# yet — releases lag one minor). Re-pin and adopt it once it catches up;
# until then the shell renders its charts with the egui painter
# (crates/app-shell/src/chart.rs).


regex = "1"

reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "form"] }

futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }

url = "2"

supportos-plus-catalog = { path = "crates/catalog" }
supportos-plus-core = { path = "crates/core" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[profile.dev]
# No debuginfo: keeps memory/disk footprint low when compiling the embedded
# qdrant engine in constrained environments.
debug = 0
