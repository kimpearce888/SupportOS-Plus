[package]
name = "supportos-plus-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "SupportOS+ core: pure-Rust business logic, DB, sync, AI, VectorStore."

[lib]
name = "spp_core"
path = "src/lib.rs"

[dependencies]
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
tokio.workspace = true
rusqlite.workspace = true
aes-gcm.workspace = true
rand.workspace = true
sha2 = "0.11"
base64 = "0.23"
hmac = "0.13"
sha1 = "0.11"
hex = "0.4"
regex.workspace = true
async-trait = "0.1"
reqwest = { workspace = true }
url = { workspace = true }
futures-util = { workspace = true }
supportos-plus-catalog = { workspace = true }
ammonia = "4.2"
pdf-extract = "0.12"
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.42"

[dependencies.sqlite-vec]
version = "=0.1.9"

[features]
kittest-ui = []
sandbox = ["dep:landlock", "dep:seccompiler", "dep:libc"]

[target.'cfg(target_os = "linux")'.dependencies]
landlock = { version = "0.4", optional = true }
seccompiler = { version = "0.5", optional = true }
libc = { version = "0.2", optional = true }

[lints]
workspace = true
