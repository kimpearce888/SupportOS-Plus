[package]
name = "supportos-plus-app-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "SupportOS+ native desktop shell: eframe/egui (decision D1), theme from the settings table, flock single-instance, background-task bridge, ported pages."

[lib]
name = "spp_shell"
path = "src/lib.rs"

[[bin]]
name = "supportos-plus"
path = "src/main.rs"

[features]
default = []
# Built-in visual verification harness (off in every normal build): runs the
# real shell headless under Xvfb with the software-GL glow renderer and
# eframe's __screenshot hook, then exits after saving one PNG. Driven by env
# vars (SPP_SHOT_PAGE / SPP_SHOT_THEME / SPP_SHOT_W / SPP_SHOT_H /
# SPP_SHOT_SEED / SPP_SHOT_PALETTE / EFRAME_SCREENSHOT_TO).
ui-screenshot = ["eframe/glow", "eframe/__screenshot"]
# RS-13 kittest snapshot harness (tests/kittest_widgets.rs) — needs a
# display (Xvfb); off in every normal/CI build, like ui-screenshot.
kittest-ui = []

[dependencies]
eframe.workspace = true
supportos-plus-core.workspace = true
libc = "0.2"
tokio.workspace = true
tracing.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
sha2 = "0.11"
hex = "0.4"

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["eframe", "snapshot", "wgpu"] }
