[package]
name = "supportos-plusplus-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "SupportOS++ Leptos/WASM UI."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
serde.workspace = true
serde_json.workspace = true
supportos-plusplus-catalog = { workspace = true }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Blob",
  "Document",
  "Element",
  "Event",
  "EventSource",
  "EventTarget",
  "File",
  "FileList",
  "Headers",
  "HtmlElement",
  "HtmlInputElement",
  "KeyboardEvent",
  "MessageEvent",
  "RequestInit",
  "Response",
  "Storage",
  "Window",
] }
