# ONE-SHOT (Batch AU-2 wave 2, decisions.md D11): regenerate exactly the two
# identity goldens shifted by the four deleted design widgets. This sandbox
# environment cannot render (no Vulkan ICD, no root); the committed baselines
# were produced on this runner family with Mesa's lavapipe, so the
# regeneration runs here with UPDATE_SNAPSHOTS=1 and uploads the result.
# DELETE THIS FILE after the baselines are committed.
name: au2-baseline-regen (one-shot)
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
          rustc --version

      - name: Cache cargo state
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install the software Vulkan rasterizer (lavapipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers
          ls /usr/share/vulkan/icd.d/

      - name: Regenerate the identity goldens (UPDATE_SNAPSHOTS=1)
        env:
          WGPU_BACKEND: vulkan
          UPDATE_SNAPSHOTS: "1"
        run: |
          ICD="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)"
          test -n "$ICD" || { echo "no lavapipe ICD found"; exit 1; }
          echo "Using lavapipe ICD: $ICD"
          export VK_DRIVER_FILES="$ICD" VK_ICD_FILENAMES="$ICD"
          cargo test --locked -p supportos-plus-app-shell --features kittest-ui \
            --test kittest_widgets inbox_identity_snapshot -- --exact \
            inbox_identity_snapshot_light inbox_identity_snapshot_dark

      - name: Upload regenerated baselines
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: au2-regen-baselines
          path: crates/app-shell/tests/snapshots/r2c_inbox_identity_*
          if-no-files-found: error
