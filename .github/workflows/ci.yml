name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test, deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        # rust-toolchain.toml is the single source of truth for the exact
        # toolchain version; `rustup toolchain install` reads it directly.
        run: |
          rustup toolchain install
          rustup show active-toolchain
          rustc --version

      - name: Cache cargo state
        uses: Swatinem/rust-cache@v2

      # Phase 4 cutover is done: the Leptos/WASM ui crate and the Tauri
      # app are gone, the egui app-shell needs no system deps, so every
      # check runs workspace-wide.
      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (workspace)
        run: cargo test --workspace

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Deny (advisories, licenses)
        run: cargo deny check advisories licenses
