# ONE-SHOT (Batch AU-2 closure, second pass): regenerate ALL kittest goldens
# against the current program. Context: cargo test fail-fast stopped the CI
# kittest job at the automation suite since wave 1, so suites after it were
# never diff-locked against the wave-1/wave-2 program changes, and the
# earlier partial regen commits did not land. This run re-renders every suite
# with UPDATE_SNAPSHOTS=1 and uploads the whole snapshots directory (new,
# .old backup and .diff images) so every changed golden can be diff-audited
# before the result is committed. DELETE THIS FILE after the baselines land.
name: au2-full-regen (one-shot)
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
          rustc --version

      - name: Cache cargo state
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install the software Vulkan rasterizer (lavapipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers
          ls /usr/share/vulkan/icd.d/

      - name: Regenerate every kittest golden (UPDATE_SNAPSHOTS=1)
        env:
          WGPU_BACKEND: vulkan
          UPDATE_SNAPSHOTS: "1"
        run: |
          ICD="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)"
          test -n "$ICD" || { echo "no lavapipe ICD found"; exit 1; }
          echo "Using lavapipe ICD: $ICD"
          export VK_DRIVER_FILES="$ICD" VK_ICD_FILENAMES="$ICD"
          cargo test --locked -p supportos-plus-app-shell --features kittest-ui

      - name: Upload the whole snapshots directory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: au2-full-baselines
          path: crates/app-shell/tests/snapshots/
          if-no-files-found: error
