# ONE-SHOT (Batch AU-2 closure): regenerate the seven automation goldens that
# wave 1's AU2-1 form changes shifted (trigger vocabulary, Set priority
# removal, Send note addition). The CI kittest job on f526f5b was already red
# for exactly these seven — wave 2 inherited that drift. Same D11 path as the
# identity goldens: this sandbox cannot render (no Vulkan ICD, no root);
# the baselines regenerate here with UPDATE_SNAPSHOTS=1. DELETE THIS FILE
# after the baselines are committed.
name: au2-automation-regen (one-shot)
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
          rustc --version

      - name: Cache cargo state
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install the software Vulkan rasterizer (lavapipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers
          ls /usr/share/vulkan/icd.d/

      - name: Regenerate the automation goldens (UPDATE_SNAPSHOTS=1)
        env:
          WGPU_BACKEND: vulkan
          UPDATE_SNAPSHOTS: "1"
        run: |
          ICD="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)"
          test -n "$ICD" || { echo "no lavapipe ICD found"; exit 1; }
          echo "Using lavapipe ICD: $ICD"
          export VK_DRIVER_FILES="$ICD" VK_ICD_FILENAMES="$ICD"
          cargo test --locked -p supportos-plus-app-shell --features kittest-ui \
            --test kittest_automation_page r3_automation

      - name: Upload regenerated baselines
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: au2-automation-baselines
          path: crates/app-shell/tests/snapshots/r3_automation_*
          if-no-files-found: error
