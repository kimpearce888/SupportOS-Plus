<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SupportOS+ — DS-conformed app (design lab v4)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ds.css">
<link rel="stylesheet" href="reskin.css">
</head>
<body data-theme="light">
  <div class="app">
    <aside class="sidebar">
      <div class="sb-head">
        <div class="logo-badge">S+</div>
        <div>
          <div class="sb-app">SupportOS+</div>
          <div class="sb-ver">v1.8.0 · DS-4</div>
        </div>
      </div>
      <button class="sb-search" type="button" id="sb-search">
        <span id="sb-search-ic"></span> Search… <kbd>⌘K</kbd>
      </button>
      <nav class="sb-nav" id="sb-nav" aria-label="Primary"></nav>
      <button class="sb-theme" id="theme-toggle" type="button">
        <span id="theme-ic"></span><span id="theme-label">switch to dark theme</span>
      </button>
    </aside>

    <div class="main">
      <header class="topbar">
        <span class="freshness ok" title="open Sync Health (last sync, checkpoints, runs)">synced 2m ago</span>
        <button class="ghost-btn" type="button" data-goto="search"><span class="ic-search"></span> Search ⌘K</button>
        <button class="icon-btn" type="button" aria-label="Notifications" data-goto="notifications"><span class="ic-bell"></span></button>
      </header>

      <div id="inbox-page" hidden></div>

      <main id="page-root" class="page-root" hidden></main>
    </div>
  </div>

  <aside class="notes-drawer" id="notes-drawer" aria-label="Design notes">
    <div class="nd-head">
      <div>
        <div class="nd-title">Design notes — what changed and why</div>
        <div class="nd-sub">Every pin cites the forensic receipt it fixes.</div>
      </div>
      <button class="icon-btn" id="notes-close" type="button" aria-label="Close design notes"><span id="notes-x"></span></button>
    </div>
    <div class="nd-list" id="nd-list"></div>
  </aside>

  <div class="replica-tag">design-lab-v4 · DS-4 conformed · every page = PAGE_DATA + one DS archetype · presentation only, zero behavior changes · data-track items mocked</div>

  <script src="data.js"></script>
  <script src="ds.js"></script>
  <script src="pages-ds.js"></script>
  <script src="reskin.js"></script>
</body>
</html>
